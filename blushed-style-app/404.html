<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blushed Style — Page Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:#FDF6F9;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .wrap{max-width:400px}
  .num{font-family:'Cormorant Garamond',serif;font-size:120px;font-weight:500;color:#F2C4D0;line-height:1}
  .icon{font-size:48px;margin-bottom:16px}
  h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;color:#2D1B22;margin-bottom:10px}
  p{font-size:14px;color:#8B5A6B;line-height:1.65;margin-bottom:28px}
  a{display:inline-block;padding:11px 28px;background:#E75480;color:#fff;border-radius:40px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;text-decoration:none;transition:background .2s}
  a:hover{background:#C2185B}
</style>
</head>
<body>
<div class="wrap">
  <div class="num">404</div>
  <div class="icon">👗</div>
  <h1>Outfit not found</h1>
  <p>Looks like this page got lost in the wardrobe. Let's get you back to your looks.</p>
  <a href="index.html">← Back to Blushed Style</a>
</div>
</body>
</html>
